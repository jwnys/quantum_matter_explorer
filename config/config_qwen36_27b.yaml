# QuantumMatterExplorer configuration: Qwen3.6-27B (dense, local vLLM)
#
# Runs Qwen3.6-27B as the agent model, in place of the default Gemma-4-31B:
#     python main.py -i input/xxz_chain.md -c config/config_qwen36_27b.yaml
#
# Notes:
#   * Thinking is native and on by default, separated from the answer and tool calls
#     by reasoning_parser: qwen3. The gemma <|think|> prepend does not apply here
#     (agent.thinking_mode stays false; that flag is Gemma-only).
#   * Tool calls use Qwen3.6's official parser, tool_call_parser: qwen3_coder. If a
#     live test ever shows tool calls landing in message content instead of being
#     parsed, qwen3xml and hermes also ship with vLLM 0.21.0.
#   * The 262144 context is native; no rope scaling needed.
#   * Sampling follows Qwen3.6's official thinking / precise-coding preset
#     (temperature 0.6, top_p 0.95, top_k 20, min_p 0). top_k and min_p are vLLM-only
#     parameters and are forwarded via extra_body by the provider.

llm:
  provider: vllm

  vllm:
    model: Qwen/Qwen3.6-27B            # HF repo id, dense 27B (~54 GB; first launch downloads it)
    context_length: 262144
    gpu_id: "0,1"                      # 27B bf16 fits TP=2 on two large GPUs with room for
                                       # the 262K KV cache; lower context_length if it OOMs
    tensor_parallel_size: 2
    base_url: http://localhost:11437
    gpu_memory_utilization: 0.90
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    auto_launch: true
    server_python: null                # python of the vLLM venv ($QME_VLLM_PYTHON / python3)
    download_dir: null                 # null = standard Hugging Face cache
    launch_timeout_seconds: 900
    enforce_eager: false
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3
    startup_cleanup: own

agent:
  summary_headroom: 0.85
  recursion_limit: 100000
  enable_data_analyst: true
  enable_physics_critic: true
  enable_skills: true
  thinking_mode: false                # Gemma-only; Qwen's thinking is native and handled
                                      # by the reasoning parser
  enable_path_guard: true
  enable_edit_reground: true
  enable_nudges: true
  nudge_every_k: 4
  nudge_loop_k: 6
  nudge_thrash_k: 8
  nudge_summary_k: 6
  human_in_the_loop: false
  hitl_timeout_minutes: 720
  hitl_notify_urls: []

julia:
  executable: julia
  depot_path: null
  itensor_libraries_dir: third_party
  run_timeout_seconds: 600
  project_dir: output/julia_project
  threads: 8
  blas_threads: 8
  batch_max_parallel: 8

run:
  output_dir: ./output
  max_outer_iterations: 100
  no_progress_iterations: 2

logging:
  level: INFO
  log_dir: ./output/logs
  jsonl_file: interactions.jsonl
  text_file: transcript.txt
  rich_console: true
  slack_webhook_url: null
  slack_truncate: true
  terminal_truncate: true
