name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e .[dev]
      - name: Skill lint
        run: python tools/check_skills.py
      - name: Tests
        run: python -m pytest tests/ -q
